services:

  # ─── Base de données PostgreSQL ───
  db:
    image: postgres:16-alpine
    container_name: auris_db
    restart: always
    environment:
      POSTGRES_DB:       auris
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auris_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend FastAPI ───
  backend:
    image: ghcr.io/theochannarond/auris-backend:latest
    container_name: auris_backend
    restart: always
    environment:
      DATABASE_URL:          postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auris
      KEYCLOAK_URL:          http://keycloak:8080
      KEYCLOAK_REALM:        ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID:    ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MISTRAL_API_KEY:       ${MISTRAL_API_KEY}
      VOXTRAL_MODEL:         ${VOXTRAL_MODEL}
      VOXTRAL_TIMEOUT_SEC:   ${VOXTRAL_TIMEOUT_SEC}
      MAX_RETRY_COUNT:       ${MAX_RETRY_COUNT}
      OVH_ACCESS_KEY:        ${OVH_ACCESS_KEY}
      OVH_SECRET_KEY:        ${OVH_SECRET_KEY}
      OVH_BUCKET_NAME:       ${OVH_BUCKET_NAME}
      OVH_ENDPOINT_URL:      ${OVH_ENDPOINT_URL}
      OVH_REGION:            ${OVH_REGION}
      VEXA_API_KEY:          ${VEXA_API_KEY}
      VEXA_WEBHOOK_SECRET:   ${VEXA_WEBHOOK_SECRET}
      OVH_BACKUP_BUCKET:     ${OVH_BACKUP_BUCKET}
      LOG_LEVEL:             ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auris_network

  # ─── Frontend React ───
  frontend:
    image: ghcr.io/theochannarond/auris-frontend:latest
    container_name: auris_frontend
    restart: always
    environment:
      VITE_API_PROXY_TARGET:    http://backend:8000
      VITE_KEYCLOAK_URL:        ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM:      ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID:  ${VITE_KEYCLOAK_CLIENT_ID}
    depends_on:
      - backend
    networks:
      - auris_network

  # ─── Keycloak Auth ───
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: auris_keycloak
    restart: always
    command: start --optimized
    environment:
      KEYCLOAK_ADMIN:          ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB:                   postgres
      KC_DB_URL:               jdbc:postgresql://db:5432/auris
      KC_DB_USERNAME:          ${POSTGRES_USER}
      KC_DB_PASSWORD:          ${POSTGRES_PASSWORD}
      KC_HOSTNAME:             ${KC_HOSTNAME}
      KC_PROXY:                edge
      KC_HTTP_ENABLED:         "true"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - auris_network

  # ─── nginx reverse proxy ───
  nginx:
    image: nginx:alpine
    container_name: auris_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
      - keycloak
    networks:
      - auris_network

volumes:
  postgres_data:
  certbot_webroot:

networks:
  auris_network:
    driver: bridge