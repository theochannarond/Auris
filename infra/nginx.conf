events {}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Laisse passer les requêtes de validation Certbot (nécessaire pour
        # l'obtention ET le renouvellement automatique des certificats —
        # SCRUM-246/248/249), sans quoi la redirection ci-dessous les
        # empêcherait d'aboutir.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tout le reste est redirigé vers HTTPS — plus aucun trafic HTTP
        # normal n'est servi ici (SCRUM-247).
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS — SCRUM-248 ───
    # TODO(SCRUM-170) : remplacer "auris.example.com" par le vrai nom de
    # domaine une fois le serveur OVH provisionné (placeholder pour l'instant).
    server {
        listen 443 ssl;
        server_name auris.example.com;

        # Ces fichiers n'existent que sur le vrai serveur, une fois Certbot
        # exécuté (SCRUM-246/248) — chemin standard généré par Let's Encrypt.
        ssl_certificate     /etc/letsencrypt/live/auris.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/auris.example.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
