events {}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Résolveur DNS interne de Docker (SCRUM-176).
    #
    # Sans lui, nginx résout les noms de ses proxy_pass une seule fois, au
    # chargement de sa configuration, et garde l'adresse IP indéfiniment. Or
    # un conteneur recréé change d'IP : nginx continuait alors d'écrire vers
    # une adresse morte et renvoyait 502 jusqu'à ce qu'on le redémarre à la
    # main. Ce piège nous a coûté plusieurs diagnostics, et il devenait
    # inacceptable dès lors que la surveillance redémarre les services toute
    # seule, sans personne pour relancer nginx derrière.
    #
    # Associé aux variables utilisées dans les proxy_pass ci-dessous, il force
    # une résolution à chaque requête, avec une mise en cache de 10 secondes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        # Laisse passer les requêtes de validation Certbot (nécessaire pour
        # l'obtention ET le renouvellement automatique des certificats —
        # SCRUM-246/248/249), sans quoi la redirection ci-dessous les
        # empêcherait d'aboutir.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Sonde de vivacité de nginx lui-même (SCRUM-176). Placée avant la
        # redirection, sinon le health check recevrait un 301 vers https://
        # et devrait résoudre le nom public depuis l'intérieur du conteneur.
        # Répond en local uniquement : le port 80 n'est atteignable de
        # l'extérieur que via le pare-feu, et cette route ne divulgue rien.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Tout le reste est redirigé vers HTTPS — plus aucun trafic HTTP
        # normal n'est servi ici (SCRUM-247).
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS — SCRUM-248 ───
    server {
        listen 443 ssl;
        server_name aurishetic.fr www.aurishetic.fr;

        # Ces fichiers n'existent que sur le vrai serveur, une fois Certbot
        # exécuté (SCRUM-246/248) — chemin standard généré par Let's Encrypt.
        # Le certificat doit couvrir les deux noms ci-dessus :
        #   certbot certonly --webroot -w /var/www/certbot \
        #           -d aurishetic.fr -d www.aurishetic.fr
        ssl_certificate     /etc/letsencrypt/live/aurishetic.fr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aurishetic.fr/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Le nom de l'hôte passe par une variable : c'est ce qui oblige nginx
        # à interroger le résolveur à chaque requête plutôt qu'une seule fois
        # au démarrage. Contrepartie, l'URI n'est alors plus transmise
        # automatiquement, d'où le $request_uri explicite — qui reproduit
        # exactement le comportement précédent, chaîne de requête comprise.
        location /api/ {
            set $upstream_backend backend;
            proxy_pass http://$upstream_backend:8000$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Pas de slash final après le port : le préfixe /auth doit être
        # transmis tel quel à Keycloak, qui est configuré pour servir sous
        # ce préfixe (KC_HTTP_RELATIVE_PATH dans docker-compose.prod.yml).
        # Avec un slash final, nginx retirait /auth et Keycloak renvoyait
        # ensuite des URL de redirection sans préfixe — boucle de connexion.
        location /auth/ {
            set $upstream_keycloak keycloak;
            proxy_pass http://$upstream_keycloak:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Port 80 et non 5173 : en production l'image frontend ne lance plus
        # le serveur de développement Vite, elle sert les fichiers statiques
        # construits par "npm run build" (voir frontend/Dockerfile).
        location / {
            set $upstream_frontend frontend;
            proxy_pass http://$upstream_frontend:80$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
