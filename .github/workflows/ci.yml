name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Un nouveau push sur une PR annule le run précédent, encore en cours pour rien
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # Même version que backend/Dockerfile : les versions épinglées dans
      # requirements.txt n'ont pas de roue pour 3.13 et la compilation échoue
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          PYTHONPATH: .
        run: pytest -q

  frontend:
    name: Tests frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vitest
        run: npm test

  e2e:
    name: Tests E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      # Le binaire du navigateur ne vit pas dans node_modules : il faut le
      # télécharger séparément, avec ses dépendances système
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts démarre Vite tout seul via son bloc webServer
      - name: Playwright
        run: npx playwright test

      - name: Conserver le rapport
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  images:
    name: Images Docker
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sur develop les images sont construites mais pas publiées : ça valide
      # les Dockerfile sans écraser les images que le serveur utilise.
      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.ref_name == 'main' }}
          tags: ghcr.io/theochannarond/auris-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les VITE_* sont figées dans le bundle à la construction : elles doivent
      # être passées ici, pas dans docker-compose.prod.yml (cf. frontend/Dockerfile)
      - name: Image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.ref_name == 'main' }}
          tags: ghcr.io/theochannarond/auris-frontend:latest
          build-args: |
            VITE_KEYCLOAK_URL=${{ secrets.VITE_KEYCLOAK_URL }}
            VITE_KEYCLOAK_REALM=${{ secrets.VITE_KEYCLOAK_REALM }}
            VITE_KEYCLOAK_CLIENT_ID=${{ secrets.VITE_KEYCLOAK_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement OVH
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      # Prérequis à faire une seule fois sur le VPS :
      #   sudo git clone https://github.com/theochannarond/Auris.git /opt/auris
      #   puis renseigner /opt/auris/.env.prod (cf. infra/scripts/setup-env.sh)
      - name: Déployer sur le serveur OVH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'ubuntu' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          # sudo partout : /opt/auris appartient à root et .env.prod est en 600
          # root:root (cf. infra/scripts/setup-env.sh)
          script: |
            set -e
            cd /opt/auris
            sudo git pull origin main
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose -f infra/docker-compose.prod.yml --env-file .env.prod pull
            sudo docker compose -f infra/docker-compose.prod.yml --env-file .env.prod up -d
            sudo docker image prune -f
        env:
          GHCR_USER:  ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
